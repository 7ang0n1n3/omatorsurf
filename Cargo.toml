[package]
name = "omatorsurf"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Tor routing controller for Omarchy and Arch Linux"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
